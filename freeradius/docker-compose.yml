services:
  freeradius:
    image: freeradius/freeradius-server:latest
    container_name: kilusi-freeradius
    restart: unless-stopped
    ports:
      - "1812:1812/udp"   # Authentication
      - "1813:1813/udp"   # Accounting
      - "18120:18120/tcp" # Admin
      - "3799:3799/udp"   # CoA (Change of Authorization)
    volumes:
      - ./config/clients.conf:/etc/freeradius/clients.conf
      - ./config/mods-available/sql:/etc/freeradius/mods-available/sql
      - ./config/sites-available/default:/etc/freeradius/sites-available/default
      - ./config/users:/etc/freeradius/mods-config/files/authorize
    environment:
      - DB_NAME=${DB_NAME:-kilusi_bill}
      - DB_HOST=${DB_HOST:-kilusi-postgres}
      - DB_PORT=${DB_PORT:-5432}
      - DB_USER=${DB_USER:-kilusi_user}
      - DB_PASSWORD=${DB_PASSWORD:-kilusi17!}
      - TZ=Asia/Jakarta
    networks:
      - kilusi-bill_kilusi-network
    command: >
      sh -c "ln -sf /etc/freeradius/mods-available/sql /etc/freeradius/mods-enabled/sql && freeradius -f"
    healthcheck:
      test: ["CMD", "pgrep", "freeradius"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s

networks:
  kilusi-bill_kilusi-network:
    external: true
