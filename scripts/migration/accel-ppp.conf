# ==============================================================================
# ACCEL-PPP LINUX BRAS CONFIGURATION FOR KILUSI-BILL SINGLE SERVER VPS
# ==============================================================================
# WireGuard IP: 10.100.0.3/24
# RADIUS Server: 10.100.0.1 (Single Server VPS)
# ==============================================================================

[modules]
log_file
pppoe
auth_pap
auth_chap_md5
radius
shaper
sigchld

[core]
log-error=/var/log/accel-ppp/accel-ppp.log
thread-count=8

[ppp]
verbose=1
min-mtu=1280
mtu=1492
mru=1492
ccp=0
check-ip=1

[pppoe]
verbose=1
interface=vlan100
interface=vlan101

[radius]
dictionary=/usr/share/accel-ppp/radius/dictionary
nas-identifier=accel-ppp-bras
nas-ip-address=10.100.0.3
server=10.100.0.1,kilusiradiussecret!,auth-port=1812,acct-port=1813,req-limit=0,fail-time=0
dae-server=10.100.0.3:3799,kilusiradiussecret!
verbose=1
timeout=3
max-try=3
acct-interim-interval=60

[client-ip-range]
10.30.0.0/16

[shaper]
verbose=1
attr=Mikrotik-Rate-Limit
vendor=Mikrotik
